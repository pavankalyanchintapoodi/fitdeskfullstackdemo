services:
  - type: web
    name: fitdesk-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: false
    disk:
      name: fitdesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /var/data/fitdesk.sqlite
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "+91"
